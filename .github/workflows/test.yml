name: Deterministic engine tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Maintained owner-approved suite; never imports the retired scenario atlas.
      - run: npm run test:focused
      - run: node --test right2cloud-module/tests/module.test.mjs
      - run: npm run build:extension
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: click2cloud-unpacked
          path: dist/click2cloud
          if-no-files-found: error
      # Real IndexedDB crash/recovery guard in the existing job. No cloud credentials.
      - name: CURRENT persistence and native-authority regression
        env:
          C2C_CHROME_EXECUTABLE: /usr/bin/google-chrome
          C2C_RECOVERY_EVIDENCE: ${{ runner.temp }}/click2cloud-current-recovery
        run: |
          mkdir -p /tmp/c2c-current-baseline /tmp/c2c-boot-before /tmp/c2c-ratchet-baseline /tmp/c2c-agent-scope-baseline
          git archive 3805acbe1bce14db88077acf5d688fa83bf76b2e | tar -x -C /tmp/c2c-current-baseline
          git archive 0222969 | tar -x -C /tmp/c2c-boot-before
          git archive 08703cd | tar -x -C /tmp/c2c-ratchet-baseline
          git archive 204d400 | tar -x -C /tmp/c2c-agent-scope-baseline
          node scripts/test-current-recovery-browser.mjs
          C2C_BOOT_EVIDENCE="${{ runner.temp }}/click2cloud-boot" node scripts/test-boot-login-browser.mjs
          C2C_BOOT_BASELINE_LOSS=1 C2C_BOOT_BEFORE_ROOT=/tmp/c2c-current-baseline C2C_BOOT_EVIDENCE="${{ runner.temp }}/click2cloud-original-shelf" node scripts/test-boot-login-browser.mjs
          C2C_BOOT_WORKFLOW=1 C2C_BOOT_EVIDENCE="${{ runner.temp }}/click2cloud-login-workflow" node scripts/test-boot-login-browser.mjs
          C2C_GALLERY_GEOMETRY=1 C2C_GALLERY_LOADING=1 C2C_GALLERY_NAVIGATION=1 C2C_IMAGE_EVIDENCE="${{ runner.temp }}/click2cloud-image-read" node scripts/test-image-gallery-browser.mjs
          mkdir -p /tmp/c2c-working-checkpoint
          git archive 3b24320138ff0ebbf50a0e6a912a5d2800038676 | tar -x -C /tmp/c2c-working-checkpoint
          C2C_NARROW_PHASE=3 C2C_COMPOSITION_GATE=1 C2C_NARROW_EVIDENCE="${{ runner.temp }}/click2cloud-composition" node scripts/test-phased-narrow-browser.mjs
          node scripts/assert-reliability-receipts.mjs "${{ runner.temp }}/click2cloud-current-recovery/browser.json" "${{ runner.temp }}/click2cloud-boot/results.json" "${{ runner.temp }}/click2cloud-original-shelf/results.json"
  screenshot-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:extension
      - name: Install Chrome for Testing and X11 dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-xlib imagemagick tesseract-ocr
          curl --fail --silent --show-error --location --retry 3 https://storage.googleapis.com/chrome-for-testing-public/158.0.8127.36/linux64/chrome-linux64.zip -o "$RUNNER_TEMP/chrome-linux64.zip"
          unzip -q "$RUNNER_TEMP/chrome-linux64.zip" -d "$RUNNER_TEMP"
      - name: Probe exact Ctrl+Shift+F7 manifest support
        env:
          C2C_CHROME_EXECUTABLE: ${{ runner.temp }}/chrome-linux64/chrome
        run: node scripts/probe-chrome-f7.mjs
      - name: Installed Chrome Get URL against the HTTPS fixture
        env:
          C2C_CHROME_EXECUTABLE: ${{ runner.temp }}/chrome-linux64/chrome
          C2C_GET_URL_EVIDENCE: ${{ runner.temp }}/click2cloud-get-url
        run: node scripts/test-get-url-browser.mjs
      - name: Upload Get URL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: click2cloud-get-url-browser
          path: ${{ runner.temp }}/click2cloud-get-url
          if-no-files-found: ignore
      - name: Installed Chrome screenshot save and retry
        if: ${{ !cancelled() }}
        env:
          C2C_CHROME_EXECUTABLE: ${{ runner.temp }}/chrome-linux64/chrome
          C2C_SCREENSHOT_PYTHON: /usr/bin/python3
          C2C_SCREENSHOT_EVIDENCE: ${{ runner.temp }}/click2cloud-screenshot
          C2C_SCREENSHOT_NATIVE_MENU: '1'
        run: |
          mkdir -p "$C2C_SCREENSHOT_EVIDENCE"
          xvfb-run -a -s "-screen 0 1400x1000x24" node scripts/test-screenshot-browser.mjs 2>&1 | tee "$C2C_SCREENSHOT_EVIDENCE/browser.log"
        shell: bash
      - name: Upload screenshot test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: click2cloud-screenshot-browser
          path: ${{ runner.temp }}/click2cloud-screenshot
          if-no-files-found: error
      - name: Compare palette and layout browser evidence
        if: ${{ !cancelled() }}
        env:
          C2C_CHROME_EXECUTABLE: ${{ runner.temp }}/chrome-linux64/chrome
        run: |
          mkdir -p "$RUNNER_TEMP/click2cloud-appearance-before"
          git archive f2ba964ecf1e0ce455031538190d7baaf9de1c57 | tar -x -C "$RUNNER_TEMP/click2cloud-appearance-before"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/click2cloud-appearance-before/node_modules"
          sed -i "s|executablePath:'/usr/bin/chromium'|executablePath:process.env.C2C_CHROME_EXECUTABLE|" "$RUNNER_TEMP/click2cloud-appearance-before/scripts/test-aesthetic-browser.mjs"
          (cd "$RUNNER_TEMP/click2cloud-appearance-before" && C2C_AESTHETIC_EVIDENCE="$RUNNER_TEMP/click2cloud-appearance/before" node scripts/test-aesthetic-browser.mjs)
          C2C_AESTHETIC_EVIDENCE="$RUNNER_TEMP/click2cloud-appearance/after" node scripts/test-aesthetic-browser.mjs
      - name: Upload appearance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: click2cloud-appearance-browser
          path: ${{ runner.temp }}/click2cloud-appearance
          if-no-files-found: ignore
