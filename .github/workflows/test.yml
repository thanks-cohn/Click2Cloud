name: Deterministic engine tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --test assisted_proposal/tests/*.test.mjs
      - run: node --test simple/original_proposition/tests/*.test.mjs
      - run: node --test shared_destination_picker/tests/*.test.mjs
      - run: node --test assisted_proposal/depth/tests/*.test.mjs
      - run: node --test destination_manager/tests/*.test.mjs
