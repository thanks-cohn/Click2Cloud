name: Deterministic engine tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Maintained owner-approved suite; never imports the retired scenario atlas.
      - run: npm run test:focused
      - run: node --test right2cloud-module/tests/module.test.mjs
      - run: npm run build:extension
      # Real IndexedDB crash/recovery guard in the existing job. No cloud credentials.
      - name: CURRENT persistence and native-authority regression
        env:
          C2C_CHROME_EXECUTABLE: /usr/bin/google-chrome
          C2C_RECOVERY_EVIDENCE: ${{ runner.temp }}/click2cloud-current-recovery
        run: |
          mkdir -p /tmp/c2c-current-baseline /tmp/c2c-boot-before /tmp/c2c-ratchet-baseline /tmp/c2c-agent-scope-baseline
          git archive 3805acbe1bce14db88077acf5d688fa83bf76b2e | tar -x -C /tmp/c2c-current-baseline
          git archive 0222969 | tar -x -C /tmp/c2c-boot-before
          git archive 08703cd | tar -x -C /tmp/c2c-ratchet-baseline
          git archive 204d400 | tar -x -C /tmp/c2c-agent-scope-baseline
          node scripts/test-current-recovery-browser.mjs
          C2C_BOOT_EVIDENCE="${{ runner.temp }}/click2cloud-boot" node scripts/test-boot-login-browser.mjs
          C2C_BOOT_BASELINE_LOSS=1 C2C_BOOT_BEFORE_ROOT=/tmp/c2c-current-baseline C2C_BOOT_EVIDENCE="${{ runner.temp }}/click2cloud-original-shelf" node scripts/test-boot-login-browser.mjs
          C2C_BOOT_WORKFLOW=1 C2C_BOOT_EVIDENCE="${{ runner.temp }}/click2cloud-login-workflow" node scripts/test-boot-login-browser.mjs
          C2C_GALLERY_GEOMETRY=1 C2C_GALLERY_LOADING=1 C2C_GALLERY_NAVIGATION=1 C2C_IMAGE_EVIDENCE="${{ runner.temp }}/click2cloud-image-read" node scripts/test-image-gallery-browser.mjs
          mkdir -p /tmp/c2c-working-checkpoint
          git archive 3b24320138ff0ebbf50a0e6a912a5d2800038676 | tar -x -C /tmp/c2c-working-checkpoint
          C2C_NARROW_PHASE=3 C2C_COMPOSITION_GATE=1 C2C_NARROW_EVIDENCE="${{ runner.temp }}/click2cloud-composition" node scripts/test-phased-narrow-browser.mjs
          node scripts/assert-reliability-receipts.mjs "${{ runner.temp }}/click2cloud-current-recovery/browser.json" "${{ runner.temp }}/click2cloud-boot/results.json" "${{ runner.temp }}/click2cloud-original-shelf/results.json"
