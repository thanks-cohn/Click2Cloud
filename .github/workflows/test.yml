name: Deterministic engine tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Maintained owner-approved suite; never imports the retired scenario atlas.
      - run: npm run test:focused
      - run: node --test right2cloud-module/tests/module.test.mjs
      - run: npm run build:extension
