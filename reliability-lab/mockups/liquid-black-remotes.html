<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDOWN — approved Frames Chrome Remotes concept</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#080808;color:#f3f3f3;font-family:Roboto,Arial,sans-serif}.shell{max-width:365px;margin:auto;border:3px solid transparent;border-radius:12px;color:#f3f3f3;background:radial-gradient(ellipse at 110% 15%,#a0a0a045,transparent 45%),linear-gradient(145deg,#070707 8%,#363636 27%,#101010 43%,#060606 60%,#303030 83%,#080808) padding-box,linear-gradient(135deg,#d4d4d4,#666666,#151515,#050505,#999999) border-box;overflow:hidden}.nav{display:flex;align-items:center;gap:12px;padding:10px;background:linear-gradient(#424242,#171717);border-bottom:2px solid #999999;font-size:12px;font-weight:500}.logo{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;font-size:25px;font-weight:700;background:linear-gradient(140deg,#ff8295,#db1533,#90001a);border:1px solid #ff7187;box-shadow:inset 0 2px #ffb9c3,inset 0 -3px #710014}.active{padding:8px 6px;background:linear-gradient(#d71936,#96001c);border-radius:5px;border-bottom:2px solid #ff526b}.grow{flex:1}.hero{text-align:center;padding:24px 8px;font-size:24px;font-weight:500;letter-spacing:-.5px}.hero span{display:block;margin-top:17px}.cards{padding:0 12px}.panel{border:3px solid transparent;border-radius:9px;padding:12px;margin-bottom:12px;background:linear-gradient(155deg,#424242,#292929 25%,#151515 65%,#242424) padding-box,linear-gradient(145deg,#c5c5c5,#777777 20%,#303030 48%,#080808 76%,#777777) border-box;box-shadow:inset 0 1px #ffffff20,0 4px #040506,0 6px 10px #0007}.name{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;margin-bottom:11px}.name svg{width:25px;height:24px}.actions{display:flex;align-items:center;gap:6px}.btn{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;border-radius:5px;border:1px solid #777777;color:#eeeeee;background:linear-gradient(#484848,#292929 47%,#1a1a1a);padding:8px 10px;box-shadow:inset 0 1px #ffffff24,inset 0 -2px #0004,0 2px 3px #0007;white-space:nowrap}.primary{background:linear-gradient(#eeeeee,#b7b7b7);color:#151515;border-color:#dedede}.orange{background:linear-gradient(#ffb97b,#f78e37 48%,#d96216);border-color:#ffad60;color:#291304;box-shadow:inset 0 1px #ffdfbe,inset 0 -2px #9a410c,0 3px 5px #0008}.wide{display:flex;width:100%;padding:11px}.slogan{text-align:center;padding:17px 8px 26px;font-size:21px;font-weight:500;letter-spacing:-.4px;text-shadow:0 2px 4px #000}.slogan span{display:block;margin-top:15px}.footer{padding:10px;display:flex;justify-content:space-between;background:linear-gradient(#303030,#151515);border-top:2px solid #777777}
.nav{gap:9px}.active{border:1px solid #ff526b;box-shadow:inset 0 1px #ff8798aa}.panel.accent{background:linear-gradient(155deg,#424242,#292929 25%,#151515 65%,#242424) padding-box,linear-gradient(145deg,#ff5974,#dd0029 25%,#790019 70%,#d80028) border-box}.btn{height:30px;padding:0 10px}.wide{height:35px}.square{width:30px;padding:0}.square svg{width:15px;height:15px}.mode{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;border:1px solid #aaa;border-radius:7px;background:linear-gradient(145deg,#777,#303030 40%,#131313);box-shadow:inset 0 1px #fff3,0 2px 4px #0008;cursor:pointer}.mode svg{width:18px;height:18px}.repair{background:linear-gradient(#1b432e,#10251a);color:#a4f7ba;border:1px solid #64e18c;box-shadow:0 0 7px #44ff6644;animation:glow 2.6s infinite}.repair[hidden]{display:none}@keyframes glow{50%{border-color:#caffd7;box-shadow:0 0 9px #58ff7777}}@media(prefers-reduced-motion:reduce){.repair{animation:none}}

/* Approved Chrome light material, same layout and bevel geometry. */
.shell.light{color:#242424;background:radial-gradient(ellipse at -15% 40%,#fff,transparent 46%),linear-gradient(132deg,#fff 3%,#c0c0c0 19%,#f9f9f9 31%,#fff 43%,#b8b8b8 58%,#ededed 69%,#fff 82%,#bcbcbc 95%) padding-box,linear-gradient(140deg,#fff,#c3c3c3 18%,#fafafa 31%,#818181 51%,#bcbcbc 71%,#fff 88%,#888) border-box}
.light .nav,.light .footer{background:linear-gradient(#fafafa,#d3d3d3 46%,#ededed 50%,#bbb)}
.light .panel{background:linear-gradient(153deg,#fff,#e7e7e7 23%,#fdfdfd 45%,#d5d5d5 78%,#f6f6f6) padding-box,linear-gradient(140deg,#fff,#aaa 30%,#777 58%,#eee 88%,#999) border-box;box-shadow:inset 0 1px #fff,0 3px 5px #0004}
.light .panel.accent{background:linear-gradient(153deg,#fff,#e7e7e7 23%,#fdfdfd 45%,#d5d5d5 78%,#f6f6f6) padding-box,linear-gradient(140deg,#ff8b9e,#da0029 25%,#97001b 58%,#f54261 85%,#a10020) border-box}
.light .btn:not(.orange):not(.repair){color:#242424;background:linear-gradient(#fff,#dedede 48%,#c6c6c6 51%,#f1f1f1);border-color:#929292}
.light .slogan{text-shadow:none}.active,.logo{color:white}
.btn.connected,.light .btn.connected{border-color:#4a9560;background:linear-gradient(#fff,#dbebdf 48%,#c2d8c8 52%,#e8eee9);color:#27603a;box-shadow:inset 0 0 3px #4b9b6144}
.basic .square{opacity:0;pointer-events:none;transition:opacity .25s ease;transition-delay:.65s;flex-shrink:0}
.basic:hover .square,.basic:focus-within .square,.basic .square:focus-visible,.basic .square[aria-busy=true]{opacity:1;pointer-events:auto;transition-delay:0s}
@media(hover:none){.basic .square{opacity:1;pointer-events:auto}}
@media(prefers-reduced-motion:reduce){.basic .square{transition:none}}
.mode{padding:0;overflow:hidden;border:0;background:none;box-shadow:none}.mode svg{width:100%;height:100%}
</style></head><body><div class="shell"><div class="nav"><div class="logo">R</div>Files<span class="active">Remotes</span>Queue<span class="grow"></span>••• <button class="mode" type="button" aria-label="Toggle light or dark appearance" title="Switch Liquid Black / Pure Chrome"><svg viewBox="0 0 24 24" fill="none" stroke="#f2d18c" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="#e8bc64"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button></div><div class="hero">All Your Clouds<span>One Place</span></div><div class="cards" id="basicCards"></div><div class="slogan">The Future Is NOW<span>True Remote Is Here</span></div><div class="cards"><div class="panel accent"><div class="name"><svg viewBox="0 0 48 32" style="width:34px"><path fill="#f48120" d="M4 25a8 8 0 0 1 9-9 13 13 0 0 1 25 2l-3 7Z"/><path fill="#faae40" d="M37 17a7 7 0 1 1 3 12H34Z"/><path fill="#f48120" d="M3 27h30v3H3Z"/></svg>Cloudflare R2</div><div class="btn orange wide">Connect to Cloudflare</div></div></div><div class="footer"><span class="btn">▣ &nbsp; Manage Destinations</span><span class="btn repair" hidden>Repair Me</span></div></div><script>
const providers=[['Google Drive','<path fill="#0f9d58" d="M8 2h7L7 16H0Z"/><path fill="#fbbc04" d="M8 2h7l9 14h-7Z"/><path fill="#4285f4" d="M0 16h24l-4 6H4Z"/>'],['OneDrive','<path fill="#1478d4" d="M4 20a4 4 0 0 1-1-8 7 7 0 0 1 13-4 5 5 0 0 1 3 12Z"/><path fill="#48b1ed" d="M4 20a4 4 0 0 1 1-8l12 8Z"/>'],['Dropbox','<path fill="#1683ff" d="m6 2 6 4-6 4-6-4zm12 0 6 4-6 4-6-4zM6 10l6 4-6 4-6-4zm12 0 6 4-6 4-6-4zm-6 7 6 4-6 3-6-3z"/>']];document.getElementById('basicCards').innerHTML=providers.map(([name,svg])=>'<div class="panel basic"><div class="name"><svg viewBox="0 0 24 24">'+svg+'</svg>'+name+'</div><div class="actions"><span class="btn primary connected">Connected</span><span class="grow"></span><button type="button" class="btn square" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5M5.5 8a7.5 7.5 0 0 1 12.4-2L20 9M4 15l2.1 3a7.5 7.5 0 0 0 12.4-2"/></svg></button><span class="btn">GO TO</span></div></div>').join('');

// Visual reference only: use ?repair=1 to inspect the exceptional footer state, never production logic.
document.querySelector('.repair').hidden=!new URLSearchParams(location.search).has('repair');
const mode=document.querySelector('.mode'),shell=document.querySelector('.shell');
const sun=mode.innerHTML;
function moon(light){return '<svg viewBox="0 0 120 120"><defs><linearGradient id="redM" x2=".8" y2="1"><stop stop-color="#ffbbc5"/><stop offset=".23" stop-color="#ff3857"/><stop offset=".44" stop-color="#c90024"/><stop offset=".53" stop-color="#ff6079"/><stop offset=".8" stop-color="#a6001c"/><stop offset="1" stop-color="#ff264a"/></linearGradient><linearGradient id="silverM" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".22" stop-color="#aaa"/><stop offset=".45" stop-color="#fdfdfd"/><stop offset=".52" stop-color="#fff"/><stop offset=".77" stop-color="#999"/><stop offset="1" stop-color="#eee"/></linearGradient><linearGradient id="blackM" x2=".9" y2="1"><stop stop-color="#080808"/><stop offset=".25" stop-color="#545454"/><stop offset=".43" stop-color="#171717"/><stop offset=".68" stop-color="#030303"/><stop offset=".85" stop-color="#3b3b3b"/><stop offset="1" stop-color="#080808"/></linearGradient><linearGradient id="housingM" x2="1" y2="1"><stop stop-color="#494949"/><stop offset=".35" stop-color="#151515"/><stop offset=".6" stop-color="#303030"/><stop offset="1" stop-color="#050505"/></linearGradient><mask id="crescentM" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect width="120" height="120" fill="black"/><circle cx="60" cy="60" r="37" fill="white"/><circle cx="77" cy="48" r="35" fill="black"/></mask></defs><rect x="1.5" y="1.5" width="117" height="117" rx="22" fill="url(#'+(light?'silverM':'housingM')+')" stroke="'+(light?'#dedede':'url(#redM)')+'" stroke-width="3"/>'+(light?'<rect x="5" y="5" width="110" height="110" rx="18" fill="none" stroke="#777"/>':'')+'<circle cx="60" cy="60" r="37" fill="url(#'+(light?'blackM':'redM')+')" mask="url(#crescentM)"/>'+(!light?'<circle cx="60" cy="60" r="37" fill="none" stroke="url(#redM)" stroke-width="2"/>':'')+'</svg>';}
let light=false;function render(){shell.classList.toggle('light',light);mode.innerHTML=moon(light);mode.setAttribute('aria-pressed',String(light));document.title='REDOWN — Chrome / '+(light?'Pure Chrome':'Liquid Black');}
mode.onclick=()=>{light=!light;render()};render();
// Both approved moon treatments are shown on toggle; retain the golden sun asset above for production toggle state mapping.
</script></body></html>
