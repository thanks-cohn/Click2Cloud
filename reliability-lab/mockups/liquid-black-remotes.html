<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDOWN — approved Liquid Black Remotes concept</title><style>

p}.primary{background:linear-gradient(#eeeeee,#b7b7b7);color:#151515;border-color:#dedede}.orange{background:linear-gradient(#ffb97b,#f78e37 48%,#d96216);border-color:#ffad60;color:#291304;box-shadow:inset 0 1px #ffdfbe,inset 0 -2px #9a410c,0 3px 5px #0008}.wide{display:flex;width:100%;padding:11px}.slogan{text-align:center;padding:17px 8px 26px;font-size:21px;font-weight:500;letter-spacing:-.4px;text-shadow:0 2px 4px #000}.slogan span{display:block;margin-top:15px}.footer{padding:10px;display:flex;justify-content:space-between;background:linear-gradient(#303030,#151515);border-top:2px solid #777777}
